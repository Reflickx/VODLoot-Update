name: Publish VODLoot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.6.7"
        required: true
        type: string

      note:
        description: "Release note"
        required: true
        type: string

      mandatory:
        description: "Mandatory update"
        required: true
        default: false
        type: boolean

      sync_environment:
        description: "Rebuild/sync Python environment"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout update repository
        uses: actions/checkout@v6
        with:
          path: updater

      - name: Checkout private VODLoot source
        uses: actions/checkout@v6
        with:
          repository: Reflickx/VODLoot
          token: ${{ secrets.VODLOOT_SOURCE_TOKEN }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: python -m pip install cryptography

      - name: Restore private signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.VODLOOT_UPDATE_SIGNING_PRIVATE_PEM }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > signing-private.pem

      - name: Build and sign update
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.note }}
          MANDATORY: ${{ inputs.mandatory }}
          SYNC_ENVIRONMENT: ${{ inputs.sync_environment }}
        run: |
          args=(
            python updater/build_update_release.py
            --source source
            --private-key signing-private.pem
            --output release
            --base-url "https://github.com/Reflickx/VODLoot-Update/releases/download/v${VERSION}"
            --version "$VERSION"
            --note "$NOTE"
          )

          if [[ "$MANDATORY" == "true" ]]; then
            args+=(--mandatory)
          fi

          if [[ "$SYNC_ENVIRONMENT" == "true" ]]; then
            args+=(--sync-environment)
          fi

          "${args[@]}"

      - name: Remove private signing key
        if: always()
        run: rm -f signing-private.pem

      - name: Verify release files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "release/VODLoot-update-${VERSION}.zip"
          test -f "release/stable.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          release = Path("release")
          package = release / f"VODLoot-update-{version}.zip"
          manifest = json.loads((release / "stable.json").read_text())

          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          expected = manifest["sha256"]

          if actual.lower() != expected.lower():
              raise SystemExit(
                  f"SHA256 mismatch: expected {expected}, got {actual}"
              )

          print(f"Verified VODLoot {version}")
          print(f"SHA256: {actual}")
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.note }}
        run: |
          gh release create "v${VERSION}" \
            "release/VODLoot-update-${VERSION}.zip" \
            --repo "${{ github.repository }}" \
            --title "VODLoot ${VERSION}" \
            --notes "$NOTE"

      - name: Publish stable manifest last
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp release/stable.json updater/stable.json

          cd updater

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stable.json
          git commit -m "Publish VODLoot ${VERSION} manifest"
          git push